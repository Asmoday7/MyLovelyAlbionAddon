[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "albion-trade-desk"
version = "0.3.1"
description = "Local, evidence-aware market intelligence for Albion Online"
requires-python = ">=3.12"
dependencies = []

[project.scripts]
albion-trade-desk = "albion_trade_desk.__main__:main"

[tool.setuptools.package-data]
albion_trade_desk = ["static/*", "windows/*.ps1", "windows/*.json", "templates/*.json", "templates/*.xlsx"]

[tool.setuptools.packages.find]
include = ["albion_trade_desk*"]
